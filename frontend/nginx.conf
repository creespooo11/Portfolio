# Rate limits, keyed by client IP. This file is included inside nginx's
# http block (conf.d), so zones can be declared here.
#   contact: the form only needs a handful of submissions per visitor.
#   api:     generous for normal browsing, stops scripted hammering.
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;
    # Nothing here accepts uploads; the contact form is a few KB at most.
    client_max_body_size 16k;

    # Security headers. Declared once here: an add_header inside a location
    # would silently drop all of these for that location.
    # CSP: scripts only from this origin; Google Fonts for the stylesheet and
    # font files; 'unsafe-inline' styles because Vue/GSAP set inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Longest prefix match wins in nginx, so this takes precedence over the
    # generic /api/ block below for contact form submissions.
    location /api/contact {
        limit_req zone=contact burst=3 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://contact-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The public API is read-only: any write method is refused here as well
    # as in the services (their admin endpoints are off by default).
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://portfolio-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
