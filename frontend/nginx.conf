server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Longest prefix match wins in nginx, so this takes precedence over the
    # generic /api/ block below for contact form submissions.
    location /api/contact {
        proxy_pass http://contact-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://portfolio-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
