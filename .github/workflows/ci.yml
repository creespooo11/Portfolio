name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test portfolio-service
        run: mvn -f backend/portfolio-service/pom.xml test

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config
