server:
  port: ${PORTFOLIO_SERVICE_PORT:8081}
  # Never leak stack traces, exception messages or binding details to clients.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: portfolio-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:portfolio}
    username: ${POSTGRES_USER:portfolio}
    # No default: the password must come from the environment (.env).
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true
  sql:
    init:
      mode: never

portfolio:
  # Unauthenticated create/update/delete endpoints: local admin only.
  admin-endpoints:
    enabled: ${PORTFOLIO_ADMIN_ENDPOINTS:false}

