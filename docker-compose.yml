services:
  frontend:
    build:
      context: ./frontend
    container_name: portfolio-frontend
    restart: unless-stopped
    depends_on:
      - portfolio-service
    ports:
      - "${FRONTEND_PORT}:80"

  portfolio-service:
    build:
      context: ./backend/portfolio-service
    container_name: portfolio-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      PORTFOLIO_SERVICE_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORTFOLIO_SERVICE_PORT}:8081"

  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: portfolio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: portfolio-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_PORT}
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "${REDPANDA_PORT}:19092"
      - "${REDPANDA_ADMIN_PORT}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  postgres-data:
  mongo-data:
  redpanda-data:
